<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AkramFlow AI - لوحة التحكم</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; text-align: center; }
        .container { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); max-width: 600px; margin: 0 auto; }
        h1 { color: #800020; }
        textarea { width: 100%; height: 100px; padding: 10px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; font-size: 16px; margin-bottom: 15px; }
        select { width: 100%; padding: 12px; margin-bottom: 20px; border: 1px solid #ccc; border-radius: 5px; font-size: 16px; }
        button { width: 100%; padding: 12px; background-color: #800020; color: white; border: none; border-radius: 5px; font-size: 16px; cursor: pointer; font-weight: bold; }
        .result-box { background: #fafafa; border: 1px dashed #ccc; padding: 15px; margin-top: 20px; border-radius: 5px; text-align: right; white-space: pre-wrap; display: none; }
        .whatsapp-section { margin-top: 15px; padding-top: 15px; border-top: 1px solid #eee; text-align: center; font-weight: bold; }
        .whatsapp-link { display: inline-block; background-color: #25D366; color: white; padding: 8px 15px; border-radius: 5px; text-decoration: none; margin-top: 5px; }
        .logout-btn { display: inline-block; margin-top: 20px; color: #ff3333; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <h1>AkramFlow AI 🌺</h1>
        <p>حوّل أفكارك البسيطة إلى محتوى تجاري احترافي سيعود عليك بالمال</p>
        
        <label>اكتب فكرتك هنا باختصار 📋:</label>
        <textarea id="userIdea" placeholder="مثال: أدوية بشرية، مستحضرات تجميل..."></textarea>
        
        <label>نوع المحتوى أو الفكرة التسويقية 📝:</label>
        <select id="contentType">
            <option value="منشور إعلاني لوسائل التواصل">منشور إعلاني لوسائل التواصل</option>
            <option value="سيناريو فيديو قصير (Reel/TikTok)">سيناريو فيديو قصير (Reel/TikTok)</option>
            <option value="خطة تسويقية متكاملة">خطة تسويقية متكاملة</option>
            <option value="رسالة بيع مباشرة للعملاء">رسالة بيع مباشرة للعملاء</option>
        </select>

        <label>نبرة وأسلوب الكتابة ✨:</label>
        <select id="tone">
            <option value="إقناعي واحترافي للبيع">إقناعي واحترافي للبيع</option>
            <option value="تعليمي ومفيد">تعليمي ومفيد</option>
            <option value="حماسي وجذاب">حماسي وجذاب</option>
        </select>
        
        <button id="generateBtn" onclick="sendData()">جاري التفكير والتوليد الوردي... ⏳</button>
        
        <div id="resultBox" class="result-box"></div>
        
        <a href="/logout" class="logout-btn">تسجيل الخروج 🚪</a>
    </div>

    <script>
        async function sendData() {
            const idea = document.getElementById('userIdea').value;
            const contentType = document.getElementById('contentType').value;
            const tone = document.getElementById('tone').value;
            const btn = document.getElementById('generateBtn');
            const resultBox = document.getElementById('resultBox');
            
            if(!idea) {
                alert("الرجاء كتابة الفكرة أولاً!");
                return;
            }
            
            btn.disabled = true;
            btn.innerText = "جاري التوليد الآن... 🚀";
            resultBox.style.display = "none";
            
            try {
                const response = await fetch('/generate', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ 
                        idea: idea,
                        contentType: contentType,
                        tone: tone
                    })
                });
                
                if (response.status === 401) {
                    alert("انتهت الجلسة أو لم تقم بتسجيل الدخول، سيتم توجيهك لصفحة الدخول.");
                    window.location.href = "/login";
                    return;
                }
                
                const data = await response.json();
                
                if(data.status === "success") {
                    resultBox.innerHTML = `<div>${data.result}</div>
                    <div class="whatsapp-section">
                        <p>هل تريد تطوير هذه الخطة أو الحصول على استشارة مخصصة؟ 💡</p>
                        <a href="https://wa.meً أكرم، أريد الاستفسار بخصوص تطوير مشروعي التسويقي" target="_blank" class="whatsapp-link">
                            💬 تواصل معي عبر واتساب مباشرة
                        </a>
                    </div>`;
                    resultBox.style.display = "block";
                } else {
                    alert("حدث خطأ: " + data.message);
                }
            } catch (error) {
                alert("حدث خطأ في الاتصال، يرجى المحاولة مجدداً!");
                console.error(error);
            } finally {
                btn.disabled = false;
                btn.innerText = "توليد محتوى جديد ✨";
            }
        }
    </script>
</body>
</html>
