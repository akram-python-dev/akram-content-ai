<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AkramFlow AI | منصة توليد المحتوى الاحترافي</title>
    <!-- ربط خط كايرو المميز والمحترف -->
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }
        body {
            /* خلفية ناعمة بدرجات الزهري الفاتح والورود الهادئة */
            background: linear-gradient(135deg, #fff0f5 0%, #ffe4e1 100%);
            color: #4a3b40;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .app-container {
            background: rgba(255, 255, 255, 0.95);
            padding: 30px;
            border-radius: 24px;
            /* ظلال ناعمة وزهرية تعطي فخامة للمنصة */
            box-shadow: 0 12px 32px rgba(255, 182, 193, 0.3);
            width: 100%;
            max-width: 500px;
            border: 2px solid #ffb6c1;
        }
        .header {
            text-align: center;
            margin-bottom: 25px;
        }
        .header h1 {
            /* لون زهري غامق واحترافي للنصوص الرئيسية */
            color: #d81b60;
            font-size: 28px;
            font-weight: 700;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.05);
        }
        .header p {
            color: #886f77;
            font-size: 14px;
            margin-top: 8px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 14px;
            color: #880e4f;
        }
        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ffccd5;
            border-radius: 12px;
            font-size: 15px;
            background: #fffafb;
            outline: none;
            transition: 0.3s;
            color: #4a3b40;
        }
        .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
            border-color: #d81b60;
            background: #fff;
            box-shadow: 0 0 8px rgba(216, 27, 96, 0.2);
        }
        .btn-generate {
            width: 100%;
            padding: 14px;
            /* زر زهري حماسي رائع */
            background: linear-gradient(90deg, #ff4081 0%, #d81b60 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 4px 12px rgba(216, 27, 96, 0.3);
        }
        .btn-generate:hover {
            background: linear-gradient(90deg, #d81b60 0%, #ad1457 100%);
            transform: translateY(-1px);
        }
        .btn-generate:disabled {
            background: #e0b0bc;
            box-shadow: none;
            cursor: not-allowed;
        }
        .result-box {
            margin-top: 25px;
            padding: 20px;
            background: #fffafb;
            border-right: 4px solid #ff4081;
            border-radius: 12px;
            display: none;
            border: 1px solid #ffe4e1;
            border-right: 4px solid #ff4081;
        }
        .result-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        .result-title {
            font-weight: 700;
            color: #d81b60;
        }
        .btn-copy {
            padding: 6px 14px;
            background: #ad1457;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
            transition: 0.3s;
        }
        .btn-copy:hover {
            background: #880e4f;
        }
        .result-text {
            white-space: pre-line;
            line-height: 1.8;
            font-size: 15px;
            color: #4a3b40;
        }
        /* تصميم أزرار التواصل التفاعلية الملونة */
        .action-buttons-container {
            margin-top: 20px;
            display: none;
            flex-direction: column;
            gap: 10px;
        }
        .btn-action {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            padding: 12px;
            color: white;
            text-decoration: none;
            border-radius: 10px;
            font-weight: 600;
            font-size: 15px;
            transition: 0.3s;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }
        .btn-whatsapp {
            background-color: #25D366;
        }
        .btn-whatsapp:hover {
            background-color: #1ebd58;
            transform: translateY(-1px);
        }
    </style>
</head>
<body>

<div class="app-container">
    <div class="header">
        <h1>🌸 AkramFlow AI</h1>
        <p>حوّل أفكارك البسيطة إلى محتوى تجاري احترافي في عالم وردي ذكي سيعود عليك بالمال</p>
    </div>

    <div class="form-group">
        <label for="idea">اكتب فكرتك هنا باختصار 📋:</label>
        <textarea id="idea" rows="3" placeholder="مثال: متجر لبيع الورود الطازجة والهدايا المخصصة..."></textarea>
    </div>

    <div class="form-group">
        <label for="type">نوع المحتوى المطلـوب 🏷️:</label>
        <select id="type">
            <option value="خطة عمل تسويقية متكاملة">خطة عمل تسويقية متكاملة</option>
            <option value="مقال طويل احترافي">مقال طويل احترافي</option>
            <option value="سيناريو فيديو إعلاني">سيناريو فيديو إعلاني لمواقع التواصل</option>
            <option value="منشورات تسويقية للفيسبوك وانستغرام">منشورات تسويقية جذابة</option>
        </select>
    </div>

    <div class="form-group">
        <label for="tone">نبرة وأسلوب الكتابة ✨:</label>
        <select id="tone">
            <option value="إقناعي واحترافي">إقناعي واحترافي للبيع</option>
            <option value="إبداعي وحماسي">إبداعي وحماسي للشباب</option>
            <option value="رسمي وجاد">رسمي وجاد للشركات</option>
            <option value="فكاهي وقريب من القلب">فكاهي وقريب من الناس</option>
        </select>
    </div>

    <button class="btn-generate" onclick="generateContent()">توليد المحتوى الذكي الوردي 🚀</button>

    <div class="result-box" id="resultBox">
        <div class="result-header">
            <span class="result-title">المحتوى الاحترافي المولد ✨:</span>
            <button class="btn-copy" onclick="copyText()">نسخ النص 📋</button>
        </div>
        <div class="result-text" id="resultText"></div>
        
        <!-- الأزرار التفاعلية الحقيقية للاتصال والتواصل مرتبطة برقمك السوري مباشرة -->
        <div class="action-buttons-container" id="actionButtons">
            <a href="https://wa.me" target="_blank" class="btn-action btn-whatsapp">
                💬 تواصل معنا مباشرة عبر واتساب وابدأ رحلة الصدارة
            </a>
        </div>
    </div>
</div>

<script>
    async function generateContent() {
        const idea = document.getElementById('idea').value;
        const type = document.getElementById('type').value;
        const tone = document.getElementById('tone').value;
        const btn = document.querySelector('.btn-generate');
        const resultBox = document.getElementById('resultBox');
        const resultText = document.getElementById('resultText');
        const actionButtons = document.getElementById('actionButtons');

        if (!idea) {
            alert('الرجاء كتابة الفكرة أولاً يا صديقي!');
            return;
        }

        btn.innerText = 'جاري التفكير والتوليد الوردي... ⏳🌸';
        btn.disabled = true;
        resultText.innerText = '';
        resultBox.style.display = 'none';
        actionButtons.style.display = 'none';

        try {
            const response = await fetch('/generate', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ idea, type, tone })
            });

            if (!response.ok) {
                throw new Error('فشل الاتصال بخادم التوليد');
            }

            resultBox.style.display = 'block';
            resultBox.scrollIntoView({ behavior: 'smooth' });

            const reader = response.body.getReader();
            const decoder = new TextDecoder();
            let fullText = '';
            
            while (true) {
                const { value, done } = await reader.read();
                if (done) break;
                
                const chunk = decoder.decode(value, { stream: true });
                fullText += chunk;
                
                if (fullText.includes('[SHOW_CONTACT_BUTTON]')) {
                    let cleanedText = fullText.replace('[SHOW_CONTACT_BUTTON]', '');
                    resultText.innerText = cleanedText;
                    actionButtons.style.display = 'flex';
                } else {
                    resultText.innerText = fullText;
                }
            }
        } catch (error) {
            alert('حدث خطأ في الاتصال بالسيرفر المباشر أو انتهت مهلة الجلسة!');
        } finally {
            btn.innerText = 'توليد المحتوى الذكي الوردي 🚀';
            btn.disabled = false;
        }
    }

    function copyText() {
        const text = document.getElementById('resultText').innerText;
        navigator.clipboard.writeText(text).then(() => {
            alert('تم نسخ النص بنجاح إلى الحافظة! 🎉');
        });
    }
</script>

</body>
</html>
